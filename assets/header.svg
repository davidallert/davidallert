<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="David Allert, fullstack developer in Gothenburg, Sweden">
<title>David Allert, fullstack developer</title>
<defs>
<clipPath id="r"><rect width="800" height="280" rx="28"/></clipPath>
<radialGradient id="g1"><stop offset="0" stop-color="#4543F3" stop-opacity=".9"/><stop offset="1" stop-color="#4543F3" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#826FF7" stop-opacity=".75"/><stop offset="1" stop-color="#826FF7" stop-opacity="0"/></radialGradient>
<radialGradient id="g3"><stop offset="0" stop-color="#F5C84B" stop-opacity=".22"/><stop offset="1" stop-color="#F5C84B" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".07"/></pattern>
<style>
    .name{font:700 60px Inter,&apos;Segoe UI&apos;,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;letter-spacing:-1.5px;fill:#fff;animation:rise .9s ease-out both}
    .sub{font:500 23px Inter,&apos;Segoe UI&apos;,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#fff;fill-opacity:.82;animation:rise .9s .15s ease-out both}
    .t{font:600 19px Inter,&apos;Segoe UI&apos;,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#F5C84B;opacity:0;animation:cycle 12s infinite}
    .t1{opacity:1;animation-delay:.6s}
    .t2{animation-delay:4.6s}
    .t3{animation-delay:8.6s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-8px)}}
    </style>
</defs>
<rect width="800" height="280" rx="28" fill="#0A0A0F"/>
<g clip-path="url(#r)">
<rect width="800" height="280" fill="url(#dots)"/>
<circle cx="660" cy="40" r="230" fill="url(#g1)"><animate attributeName="cx" values="660;600;660" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="40;85;40" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="770" cy="275" r="190" fill="url(#g2)"><animate attributeName="cx" values="770;700;770" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="275;240;275" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="50" cy="295" r="130" fill="url(#g3)"/>
</g>
<rect x="1" y="1" width="798" height="278" rx="27" fill="none" stroke="#fff" stroke-opacity=".09"/>
<text class="name" x="56" y="118">David Allert</text>
<rect x="58" y="138" width="72" height="4" rx="2" fill="#F5C84B"><animate attributeName="width" from="0" to="72" dur=".9s" begin="0s" fill="freeze"/></rect>
<text class="sub" x="56" y="184">Fullstack developer in Gothenburg, Sweden</text>
<text class="t t1" x="56" y="230">From e-commerce to code</text>
<text class="t t2" x="56" y="230">TypeScript · React · Next.js · Laravel</text>
<text class="t t3" x="56" y="230">Open to fullstack and frontend roles</text>
</svg>